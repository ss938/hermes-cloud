services:
  - type: web
    name: hermes-gateway
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: HERMES_HF_TOKEN
        sync: false
      - key: MEMORY_REPO
        value: salah1593/hermes-memory
      - key: BACKUP_INTERVAL
        value: "86400"
      - key: RESTORE_MEMORY
        value: "1"
      - key: OPENCODE_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: NOUS_MODEL
        value: upstage/solar-pro4:free
      - key: OBSIDIAN_REPO
        value: salah1593/obsidian-vault
      - key: VAULT_SYNC_INTERVAL
        value: "300"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_ALLOWED_USERS
        sync: false
      - key: TELEGRAM_HOME_CHANNEL
        sync: false
      - key: TELEGRAM_HOME_CHANNEL_THREAD_ID
        sync: false

